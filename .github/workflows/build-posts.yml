name: Build Blog Posts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/_posts/*.md'
      - 'ar/blog/_posts/*.md'
      - 'scripts/build-posts.js'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build-posts
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build blog posts from markdown"
          file_pattern: blog/*.html ar/blog/*.html blog.html ar/blog.html
