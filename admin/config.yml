backend:
  name: git-gateway
  repo: MedoHamdani/MedoHamdani.github.io
  branch: main
  identity_url: https://auth.decapbridge.com/sites/c7da5b37-738a-4ba6-aa32-c2645e7424e1
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://medohamdani.github.io

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: blog
    create: true
    extension: html
    format: yml
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: string }
      - { label: Body, name: body, widget: text, default: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>New Post</title>\n  <link rel=\"stylesheet\" href=\"/style.css\">\n</head>\n<body>\n  <header class=\"glass-nav\">\n    <nav class=\"container nav-flex\">\n      <a href=\"/\" class=\"nav-logo\">MedoHamdani</a>\n      <button class=\"mobile-menu-btn\" aria-label=\"Toggle menu\">☰</button>\n      <ul class=\"nav-links\">\n        <li><a href=\"/\">Home</a></li>\n        <li><a href=\"/blog.html\">Blog</a></li>\n        <li><a href=\"/about.html\">About</a></li>\n        <li><a href=\"/contact.html\">Contact</a></li>\n      </ul>\n    </nav>\n  </header>\n  <main class=\"container\">\n    <article>\n      <h1>New Post</h1>\n      <p>Write your content here.</p>\n    </article>\n  </main>\n  <footer class=\"footer\">\n    <div class=\"container\">\n      <p>&copy; 2026 MedoHamdani. Biz Mapper v.1.2</p>\n    </div>\n  </footer>\n</body>\n</html>" }
